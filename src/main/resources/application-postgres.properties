# Active with --spring.profiles.active=postgres
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:skillloop_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Disable in-memory H2 console in production postgres profile
spring.h2.console.enabled=false

# Disable demo data seeding in postgres profile by default
skillloop.seed.enabled=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.custom-css=/swagger-ui-custom.css

# Configurable Academic Certification Policies
skillloop.certification.min-attendance-percentage=75.0
skillloop.certification.min-assessment-pass-percentage=50.0
skillloop.certification.min-overall-average-percentage=60.0
skillloop.certification.require-completed-enrollment=true
